<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Visualizer — MoodWave</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
<meta name="description" content="Experience music visually with MoodWave's real-time mood-adaptive visualizer. Choose your mood and watch the sound come to life."/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mw-global.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;background:#04020e;scroll-behavior:smooth}
body{color:#fff;font-family:'Syne',sans-serif}

#viz-bg{position:fixed;inset:0;z-index:0;opacity:0.35;pointer-events:none}

/* Header */
.mw-header{
  position:fixed;top:0;left:0;width:100%;height:60px;padding:0 28px;
  z-index:500;display:flex;align-items:center;justify-content:space-between;
  background:rgba(4,2,14,0.85);border-bottom:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(12px);
}
.logo{
  display:flex;align-items:center;gap:8px;
  font-family:'Syne',sans-serif;font-size:12px;font-weight:800;
  letter-spacing:4px;text-transform:uppercase;color:#fff;text-decoration:none;
}
.logo-sq{
  width:26px;height:26px;border-radius:4px;
  background:linear-gradient(135deg,#d946ef,#7c3aed);
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;
}
.mw-nav{display:flex;gap:22px;align-items:center}
.mw-nav a{
  font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:rgba(255,255,255,.4);text-decoration:none;transition:color .2s;
}
.mw-nav a:hover{color:#fff}
.mw-nav a.active{color:#a855f7}

/* Page */
.mw-page{
  position:relative;z-index:1;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:100px 20px 80px;
}

.viz-panel{
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:32px;
  padding:40px 32px;
  width:100%;max-width:900px;
  display:flex;flex-direction:column;align-items:center;
  box-shadow:0 40px 100px rgba(0,0,0,0.5);
  animation:fadeUp .8s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.section-label{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;
  text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:14px;
}

.mood-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.chip{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;
  padding:8px 18px;border-radius:100px;border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.45);
  transition:all .28s cubic-bezier(.22,1,.36,1);cursor:pointer;
}
.chip:hover{color:#fff;border-color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.08)}
.chip.active{
  color:#fff;
  border-color:var(--ma,#a855f7);
  background:rgba(255,255,255,0.08);
  box-shadow:0 0 20px var(--glow,rgba(168,85,247,0.3));
}

.beat-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
.beat-pill{
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;
  padding:8px 18px;border-radius:100px;border:1px solid rgba(255,255,255,0.08);
  background:transparent;color:rgba(255,255,255,0.35);
  transition:all .22s;cursor:pointer;display:flex;align-items:center;gap:7px;
}
.beat-pill:hover{color:rgba(255,255,255,0.8);border-color:rgba(255,255,255,0.2)}
.beat-pill.active{
  color:#fff;
  border-color:var(--ma,#a855f7);
  background:rgba(255,255,255,0.07);
  box-shadow:0 0 14px var(--glow,rgba(168,85,247,0.2));
}
.beat-pill svg{width:14px;height:14px;flex-shrink:0}

.viz-container{
  position:relative;width:100%;height:320px;margin-bottom:32px;
  background:rgba(0,0,0,0.22);border-radius:20px;
  border:1px solid rgba(255,255,255,0.05);overflow:hidden;
}
#viz-canvas{width:100%;height:100%;display:block}

.now-playing{text-align:center;margin-bottom:26px}
#songTitle{
  font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:4px;margin-bottom:4px;
  background:linear-gradient(to bottom,#fff,rgba(255,255,255,0.45));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
#songArtist{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;
  text-transform:uppercase;color:rgba(255,255,255,0.3);
}

.controls{display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center}
.play-btn{
  font-family:'Syne',sans-serif;font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
  padding:15px 44px;border-radius:100px;border:none;
  background:linear-gradient(135deg,#fff,#ccc);color:#000;
  box-shadow:0 8px 28px rgba(255,255,255,0.1);
  transition:all .28s cubic-bezier(.22,1,.36,1);cursor:pointer;
}
.play-btn:hover{transform:scale(1.05);box-shadow:0 12px 36px rgba(255,255,255,0.18)}
.play-btn:active{transform:scale(.97)}

.vol-wrap{display:flex;align-items:center;gap:10px}
.vol-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.38)}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:96px;height:4px;border-radius:99px;
  background:rgba(255,255,255,0.12);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;
  background:#fff;border:2px solid #000;box-shadow:0 0 8px rgba(255,255,255,0.4);
}

.status-bar{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;
  text-transform:uppercase;color:rgba(255,255,255,0.2);
}
.dot-live{width:6px;height:6px;border-radius:50%;background:#4ade80;opacity:0;transition:opacity .3s;flex-shrink:0}
.dot-live.show{opacity:1;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.4}}

@media(max-width:768px){
  .viz-panel{padding:24px 16px}
  .viz-container{height:200px}
  .play-btn{padding:13px 28px}
  .mw-nav{gap:10px}
  .mw-nav a{font-size:9px;letter-spacing:1px}
}
</style>
</head>
<body>

<canvas id="viz-bg"></canvas>

<header class="mw-header">
  <a href="index.html" class="logo"><div class="logo-sq">🎵</div>MoodWave</a>
  <nav class="mw-nav">
    <a href="index.html">Home</a>
    <a href="mood.html">Vibe Check</a>
    <a href="player.html">Player</a>
    <a href="discover.html">Discover</a>
    <a href="live.html">Live Stage</a>
    <a href="about.html">About</a>
    <a href="visualizer.html" class="active">Visualizer</a>
  </nav>
</header>

<div class="mw-page">
  <div class="viz-panel">
    <div class="section-label">Select Mood</div>
    <div class="mood-row" id="moodRow">
      <button class="chip active" data-mood="happy">Happy</button>
      <button class="chip" data-mood="sad">Sad</button>
      <button class="chip" data-mood="energetic">Energetic</button>
      <button class="chip" data-mood="chill">Chill</button>
      <button class="chip" data-mood="night">Night</button>
      <button class="chip" data-mood="focus">Focus</button>
    </div>

    <div class="section-label">Visualization Style</div>
    <div class="beat-row" id="beatRow">
      <button class="beat-pill active" data-beat="bars">
        <svg viewBox="0 0 12 12" fill="currentColor"><rect x="0" y="4" width="2" height="8"/><rect x="3" y="1" width="2" height="11"/><rect x="6" y="5" width="2" height="7"/><rect x="9" y="2" width="2" height="10"/></svg>
        Neon Bars
      </button>
      <button class="beat-pill" data-beat="wave">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 6 Q2 2 4 6 Q6 10 8 6 Q10 2 12 6"/></svg>
        Flow Wave
      </button>
      <button class="beat-pill" data-beat="circle">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="6" cy="6" r="4"/><circle cx="6" cy="6" r="1.5"/></svg>
        Radial Pulse
      </button>
      <button class="beat-pill" data-beat="mirror">
        <svg viewBox="0 0 12 12" fill="currentColor"><rect x="0" y="4" width="2" height="4"/><rect x="3" y="2" width="2" height="8"/><rect x="6" y="3" width="2" height="6"/><rect x="9" y="5" width="2" height="2"/></svg>
        Mirror Sync
      </button>
    </div>

    <div class="viz-container">
      <canvas id="viz-canvas"></canvas>
    </div>

    <div class="now-playing">
      <div id="songTitle">Ready to Play</div>
      <div id="songArtist">Select a mood and hit Play</div>
    </div>

    <div class="controls">
      <button class="play-btn" id="playBtn">Play Visualization</button>
      <div class="vol-wrap">
        <span class="vol-label">Volume</span>
        <input type="range" min="0" max="100" value="70" id="volSlider">
      </div>
    </div>
  </div>
</div>

<audio id="audio" crossorigin="anonymous"></audio>
<div class="status-bar">
  <div class="dot-live" id="liveDot"></div>
  <span id="statusText">System Ready</span>
</div>

<script src="songs.js"></script>

<script>
/* ─── Mood config ─── */
const MOODS = {
  happy:    { label:'Happy Vibes',   a:'#ffcc33', b:'#fbbf24', glow:'rgba(255,204,51,0.4)' },
  sad:      { label:'Melancholy',    a:'#A855F7', b:'#7C3AED', glow:'rgba(168,85,247,0.35)' },
  energetic:{ label:'Energetic',     a:'#EF4444', b:'#B91C1C', glow:'rgba(239,68,68,0.45)' },
  chill:    { label:'Chill Vibes',   a:'#00D2FF', b:'#0ea5e9', glow:'rgba(0,210,255,0.35)' },
  night:    { label:'Night Mood',    a:'#6366F1', b:'#4F46E5', glow:'rgba(99,102,241,0.4)' },
  focus:    { label:'Focus Mode',    a:'#3B82F6', b:'#2563EB', glow:'rgba(59,130,246,0.35)' },
};

/* ─── Demo tracks (no external songs.js needed) ─── */
const DEMO = {
  happy:    [{ title:'Good as Hell',          artist:'Lizzo' },            { title:'Happy',              artist:'Pharrell Williams' }],
  sad:      [{ title:'Someone Like You',      artist:'Adele' },            { title:'Skinny Love',        artist:'Bon Iver' }],
  energetic:[{ title:'Lose Yourself',         artist:'Eminem' },           { title:'Eye of the Tiger',   artist:'Survivor' }],
  chill:    [{ title:'Sunflower',             artist:'Post Malone' },      { title:'Golden',             artist:'Harry Styles' }],
  night:    [{ title:'Midnight City',         artist:'M83' },              { title:'Do I Wanna Know?',   artist:'Arctic Monkeys' }],
  focus:    [{ title:'Gymnopédie No.1',       artist:'Satie' },            { title:'Experience',         artist:'Einaudi' }],
};

let curMood = 'happy', curBeat = 'bars', playing = false, rafId = null;
let audioCtx, analyser, dataArray, source;
let currentSong = null;

const canvas  = document.getElementById('viz-canvas');
const ctx     = canvas.getContext('2d');
const bgCanvas= document.getElementById('viz-bg');
const bgCtx   = bgCanvas.getContext('2d');

/* ─── Resize ─── */
function resize() {
  canvas.width  = canvas.offsetWidth  * devicePixelRatio;
  canvas.height = canvas.offsetHeight * devicePixelRatio;
  bgCanvas.width  = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/* ─── Real audio data using Web Audio API ─── */
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  const bufferLength = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufferLength);
  
  const audio = document.getElementById('audio');
  source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
}

function getNormalizedData() {
  if (!analyser) return new Array(64).fill(0);
  analyser.getByteFrequencyData(dataArray);
  // Map 128 bins to 64 for consistency with original design
  const result = [];
  for (let i = 0; i < 64; i++) {
    result.push(dataArray[i] / 255);
  }
  return result;
}

/* ─── Mood switch ─── */
function setMood(id) {
  curMood = id;
  const m = MOODS[id];
  document.documentElement.style.setProperty('--ma', m.a);
  document.documentElement.style.setProperty('--glow', m.glow);
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.mood === id));
  
  // Pick real song from allLocalSongs
  if (window.allLocalSongs) {
    const list = window.allLocalSongs.filter(s => s.mood.toLowerCase() === id.toLowerCase());
    if (list.length) {
      const s = list[Math.floor(Math.random() * list.length)];
      currentSong = s;
      document.getElementById('songTitle').textContent = s.title;
      document.getElementById('songArtist').textContent = playing ? s.artist : 'Click Play to start · ' + m.label;
      const audio = document.getElementById('audio');
      audio.src = s.audio_url || s.url;
    }
  }
}

function setBeat(id) {
  curBeat = id;
  document.querySelectorAll('.beat-pill').forEach(p => p.classList.toggle('active', p.dataset.beat === id));
}

/* ─── Play / Pause ─── */
function startViz() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  const audio = document.getElementById('audio');
  audio.play().then(() => {
    playing = true;
    document.getElementById('playBtn').textContent = 'Pause Session';
    document.getElementById('liveDot').classList.add('show');
    document.getElementById('statusText').textContent = 'Visualizer Active';
    document.getElementById('songArtist').textContent = currentSong ? currentSong.artist : '';
    if (!rafId) render();
  }).catch(err => {
    console.error("Playback failed:", err);
    document.getElementById('statusText').textContent = 'Error playing audio';
  });
}

function stopViz() {
  playing = false;
  const audio = document.getElementById('audio');
  audio.pause();
  document.getElementById('playBtn').textContent = 'Play Visualization';
  document.getElementById('liveDot').classList.remove('show');
  document.getElementById('statusText').textContent = 'Paused';
}

/* ─── Render loop ─── */
let visualData = new Array(64).fill(0);
let phase = 0;

function render() {
  rafId = requestAnimationFrame(render);
  phase += 0.04;

  if (playing && analyser) {
    visualData = getNormalizedData();
  } else {
    // gentle idle pulse
    for (let i = 0; i < visualData.length; i++) {
      visualData[i] = 0.08 + 0.06 * Math.sin(phase + i * 0.3);
    }
  }

  const m = MOODS[curMood];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

  if      (curBeat === 'bars')   drawBars(m, visualData);
  else if (curBeat === 'wave')   drawWave(m, visualData);
  else if (curBeat === 'circle') drawRadial(m, visualData);
  else if (curBeat === 'mirror') drawMirror(m, visualData);

  const avg = visualData.reduce((a, b) => a + b, 0) / visualData.length;
  drawBgAmbient(avg, m);
}

/* ─── Draw functions ─── */
function drawBars(m, data) {
  const W = canvas.width, H = canvas.height;
  const count = Math.floor(data.length * 0.75);
  const gap = 3 * devicePixelRatio;
  const barW = (W - gap * (count - 1)) / count;

  for (let i = 0; i < count; i++) {
    const v = data[i];
    const h = v * H * 0.82;
    const x = i * (barW + gap);

    const grad = ctx.createLinearGradient(0, H, 0, H - h);
    grad.addColorStop(0, m.a);
    grad.addColorStop(1, '#ffffff');

    ctx.fillStyle = grad;
    ctx.shadowBlur = 14 * devicePixelRatio;
    ctx.shadowColor = m.a;
    ctx.fillRect(x, H - h, barW, h);
  }
  ctx.shadowBlur = 0;
}

function drawWave(m, data) {
  const W = canvas.width, H = canvas.height;
  const len = data.length;

  ctx.beginPath();
  ctx.strokeStyle = m.a;
  ctx.lineWidth = 3 * devicePixelRatio;
  ctx.lineJoin = 'round';
  ctx.shadowBlur = 18 * devicePixelRatio;
  ctx.shadowColor = m.a;

  for (let i = 0; i < len; i++) {
    const x = (i / (len - 1)) * W;
    const y = H / 2 + (data[i] - 0.25) * H * 0.9;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // gradient fill
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, m.a + '44');
  grad.addColorStop(1, m.a + '00');
  ctx.fillStyle = grad;
  ctx.fill();
}

function drawRadial(m, data) {
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const baseR = Math.min(W, H) * 0.18;
  const len = data.length;

  ctx.beginPath();
  ctx.strokeStyle = m.a;
  ctx.lineWidth = 2.5 * devicePixelRatio;
  ctx.shadowBlur = 16 * devicePixelRatio;
  ctx.shadowColor = m.a;

  for (let i = 0; i <= len; i++) {
    const v = data[i % len];
    const angle = (i / len) * Math.PI * 2 - Math.PI / 2;
    const r = baseR + v * baseR * 1.8;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // inner circle
  ctx.beginPath();
  ctx.arc(cx, cy, baseR * 0.35, 0, Math.PI * 2);
  ctx.fillStyle = m.a + '33';
  ctx.fill();
}

function drawMirror(m, data) {
  const W = canvas.width, H = canvas.height;
  const count = Math.floor(data.length * 0.4);
  const barW = (W / 2) / count;
  const gap = 2 * devicePixelRatio;

  ctx.shadowBlur = 12 * devicePixelRatio;
  ctx.shadowColor = m.a;

  for (let i = 0; i < count; i++) {
    const v = data[i];
    const h = v * H * 0.42;
    const xR = W / 2 + i * barW;
    const xL = W / 2 - (i + 1) * barW;

    const grad = ctx.createLinearGradient(0, H / 2 - h, 0, H / 2 + h);
    grad.addColorStop(0, m.a);
    grad.addColorStop(0.5, '#fff');
    grad.addColorStop(1, m.a);

    ctx.fillStyle = grad;
    ctx.fillRect(xR, H / 2 - h, barW - gap, h * 2);
    ctx.fillRect(xL, H / 2 - h, barW - gap, h * 2);
  }
  ctx.shadowBlur = 0;
}

function drawBgAmbient(val, m) {
  const W = bgCanvas.width, H = bgCanvas.height;
  const r = val * 600 + 180;
  const grad = bgCtx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, r);
  grad.addColorStop(0, m.a + '55');
  grad.addColorStop(1, 'transparent');
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, W, H);
}

/* ─── Events ─── */
document.getElementById('playBtn').onclick = () => playing ? stopViz() : startViz();
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => setMood(c.dataset.mood)));
document.querySelectorAll('.beat-pill').forEach(p => p.addEventListener('click', () => setBeat(p.dataset.beat)));
document.getElementById('volSlider').oninput = e => {
  document.getElementById('audio').volume = e.target.value / 100;
};

// Auto-play next on end
document.getElementById('audio').onended = () => {
  setMood(curMood); // Pick another random song from same mood
  if (playing) startViz();
};

/* ─── Init ─── */
setMood('happy');
render();
</script>
<script src="mw-cursor.js"></script>
</body>
</html>
