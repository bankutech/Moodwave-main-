<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Focus — MoodWave</title>
  <meta name="description" content="Deep concentration and flow state music. MoodWave Focus playlist."/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
  <link rel="stylesheet" href="mw-global.css"/>
  <style>
    :root{--accent:#22d3ee}
    html,body{overflow-x:hidden}
    .mw-page{padding-top:0!important} /* Fix header gap */

    /* FOCUS HERO — special layout with vertical pillar on right */
    .mood-hero{min-height:100vh;padding-top:66px;
      background:linear-gradient(160deg,#020c14 0%,#082f49 60%,#0e4f6b 100%);
      display:grid;grid-template-columns:1fr 1fr;align-items:center;
      position:relative;overflow:hidden}
    .hero-grid-lines{position:absolute;inset:0;pointer-events:none;
      background-image:
        repeating-linear-gradient(0deg,transparent,transparent 79px,rgba(34,211,238,.06) 80px),
        repeating-linear-gradient(90deg,transparent,transparent 79px,rgba(34,211,238,.06) 80px);}
    /* Wave pattern like in the design image */
    .hero-waves{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .hero-waves svg{position:absolute;top:50%;left:0;transform:translateY(-50%);width:100%;opacity:.12}

    .hero-left{padding:80px 60px;position:relative;z-index:1}
    .hero-number{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:rgba(34,211,238,.6);margin-bottom:24px}
    .hero-mood{font-family:'Syne',sans-serif;font-size:clamp(72px,12vw,140px);font-weight:800;text-transform:uppercase;color:#fff;line-height:.9;letter-spacing:-4px;margin-bottom:28px}
    .hero-desc{font-size:16px;font-style:italic;color:rgba(255,255,255,.55);max-width:300px;line-height:1.6;margin-bottom:32px}
    .hero-listen{display:inline-flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#fff;padding:10px 22px;border:1px solid rgba(34,211,238,.5);transition:all .25s;text-decoration:none}
    .hero-listen:hover{background:rgba(34,211,238,.1);border-color:#22d3ee;color:#22d3ee}
    .hero-right{display:flex;align-items:center;justify-content:center;padding:40px;position:relative;z-index:1}
    .play-dial{width:clamp(180px,22vw,280px);height:clamp(180px,22vw,280px);border-radius:50%;background:rgba(34,211,238,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .4s,box-shadow .4s;position:relative;border:1px solid rgba(34,211,238,.25)}
    .play-dial:hover{transform:scale(1.04);box-shadow:0 0 60px rgba(34,211,238,.25)}
    .play-dial-dot{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 0deg,rgba(255,255,255,0) 10%,rgba(255,255,255,.45) 25%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.45) 75%,rgba(255,255,255,0) 90%),repeating-radial-gradient(circle,transparent,transparent 8px,rgba(255,255,255,.1) 8px,rgba(255,255,255,.1) 9px)}
    .play-dial-dot::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:25%;height:25%;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.05)}
    .play-dial-dot::after{content:'';position:absolute;top:12px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.5)}
    @keyframes spinDisk { to { transform: rotate(360deg); } }
    .play-dial.playing .play-dial-dot{animation:spinDisk 4s linear infinite}
    .play-icon-d{width:0;height:0;border-style:solid;margin-left:8px;border-width:18px 0 18px 30px;border-color:transparent transparent transparent rgba(255,255,255,.8)}
    .play-dial.playing .play-icon-d{display:none}
    .pause-icon{display:none;gap:5px}.pause-bar{width:5px;height:28px;background:rgba(255,255,255,.8);border-radius:2px}
    .play-dial.playing .pause-icon{display:flex}

    .now-playing{padding:20px 60px;background:rgba(0,0,0,.4);backdrop-filter:blur(10px);font-family:'DM Mono',monospace;font-size:12px;color:#fff;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .np-label{opacity:.5;text-transform:uppercase;font-size:10px;letter-spacing:2px}
    .player-section{background:#04020e;padding:60px 52px}
    .player-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px;flex-wrap:wrap;gap:20px}
    .player-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}
    .ctrl-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;padding:8px 16px;cursor:pointer;transition:all .2s}
    .ctrl-btn:hover,.ctrl-btn.active{background:rgba(34,211,238,.15);border-color:rgba(34,211,238,.4);color:var(--accent)}
    .track-list{display:flex;flex-direction:column;gap:2px}
    .track-item{display:grid;grid-template-columns:40px 1fr auto auto;align-items:center;gap:16px;padding:14px 16px;border-radius:8px;cursor:pointer;transition:background .2s;border:1px solid transparent}
    .track-item:hover{background:rgba(34,211,238,.07);border-color:rgba(34,211,238,.15)}
    .track-item.active{background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.25)}
    .track-num{font-family:'DM Mono',monospace;font-size:11px;color:rgba(255,255,255,.3);text-align:center}.track-item.active .track-num{color:var(--accent)}
    .track-info .track-name{font-size:14px;font-weight:600;color:#fff;margin-bottom:3px}.track-info .track-artist{font-family:'DM Mono',monospace;font-size:11px;color:rgba(255,255,255,.4)}.track-item.active .track-name{color:var(--accent)}
    .track-mood-tag{font-family:'DM Mono',monospace;font-size:10px;padding:3px 8px;border-radius:4px;background:rgba(34,211,238,.12);color:var(--accent)}
    .track-dur{font-family:'DM Mono',monospace;font-size:11px;color:rgba(255,255,255,.3)}
    .progress-wrap{background:#04020e;padding:0 52px 40px}
    .progress-bar-bg{height:2px;background:rgba(255,255,255,.08);border-radius:1px;cursor:pointer}
    .progress-bar-fill{height:100%;background:var(--accent);border-radius:1px;width:0%;transition:width .3s linear;position:relative}
    .progress-bar-fill::after{content:'';position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--accent)}
    .progress-times{display:flex;justify-content:space-between;margin-top:8px;font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.3)}
    .main-controls{background:#04020e;padding:0 52px 52px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
    .mc-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);cursor:pointer;font-size:16px;transition:all .2s}
    .mc-btn:hover{background:rgba(34,211,238,.2);border-color:var(--accent);color:var(--accent)}
    .mc-play{width:54px;height:54px;background:var(--accent);border:none;color:#04020e;font-size:20px}
    .mc-play:hover{background:#67e8f9;transform:scale(1.05)}
    .vol-wrap{display:flex;align-items:center;gap:10px;margin-left:auto}
    .vol-icon{font-size:14px;color:rgba(255,255,255,.4)}
    .vol-slider{-webkit-appearance:none;width:100px;height:2px;background:rgba(255,255,255,.15);outline:none;cursor:pointer}
    .vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer}
    .viz-wrap{background:#04020e;padding:0 52px 20px}
    #vizCanvas{width:100%;height:60px;opacity:.7}
    @media(max-width:768px){.mood-hero{grid-template-columns:1fr}.hero-left{padding:60px 24px 30px}.hero-right{padding:20px 24px 40px}.player-section,.progress-wrap,.main-controls,.viz-wrap{padding-left:24px;padding-right:24px}.now-playing{padding:16px 24px}}
  </style>
</head>
<body>
<header class="mw-header">
  <a href="index.html" class="logo"><div class="logo-sq">🎵</div>MoodWave</a>
  <nav class="mw-nav">
    <a href="index.html">Home</a>
    <a href="mood.html">Vibe Check</a>
    <a href="player.html">Player</a>
    <a href="discover.html">Discover</a>
    <a href="live.html">Live Stage</a>
    <a href="about.html">About</a>
    <a href="visualizer.html">Visualizer</a>
  </nav>
</header>
<div class="mw-page">
  <section class="mood-hero">
    <div class="hero-grid-lines"></div>
    <div class="hero-waves">
      <svg viewBox="0 0 1400 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,200 C200,100 400,300 600,200 C800,100 1000,300 1200,200 C1350,130 1400,180 1400,200" stroke="#22d3ee" stroke-width="2" fill="none"/>
        <path d="M0,220 C200,120 400,320 600,220 C800,120 1000,320 1200,220 C1350,150 1400,200 1400,220" stroke="#0ea5e9" stroke-width="1.5" fill="none"/>
        <path d="M0,180 C200,80 400,280 600,180 C800,80 1000,280 1200,180 C1350,110 1400,160 1400,180" stroke="#38bdf8" stroke-width="1" fill="none"/>
        <path d="M0,240 C200,140 400,340 600,240 C800,140 1000,340 1200,240 C1350,170 1400,220 1400,240" stroke="#22d3ee" stroke-width="1" fill="none"/>
        <path d="M0,160 C200,60 400,260 600,160 C800,60 1000,260 1200,160 C1350,90 1400,140 1400,160" stroke="#0ea5e9" stroke-width="0.8" fill="none"/>
      </svg>
    </div>

    <div class="hero-left">
      <div class="hero-number">06 · Focus Mood</div>
      <div class="hero-mood">Focus</div>
      <div class="hero-desc">Deep concentration and flow state music.</div>
      <a href="#player" class="hero-listen">Listen →</a>
    </div>

    <div class="hero-right">
      <div class="play-dial" id="heroPlayBtn" title="Play Focus playlist">
        <div class="play-dial-dot"></div>
        <div class="play-icon-d"></div>
        <div class="pause-icon"><div class="pause-bar"></div><div class="pause-bar"></div></div>
      </div>
    </div>
  </section>

  <div class="now-playing"><span class="np-label">Now Playing</span><span id="npTitle">—</span><span id="npArtist" style="opacity:.65"></span><span class="db-sync"><span class="db-sync-dot" id="syncDot"></span>DB SYNCED</span></div>
  <div class="viz-wrap"><canvas id="vizCanvas"></canvas></div>
  <div class="progress-wrap" id="player"><div class="progress-bar-bg" id="progressBg"><div class="progress-bar-fill" id="progressFill"></div></div><div class="progress-times"><span id="timeElapsed">0:00</span><span id="timeDuration">0:00</span></div></div>
  <div class="main-controls">
    <button class="mc-btn" id="shuffleBtn">⇌</button><button class="mc-btn" id="prevBtn">⏮</button>
    <button class="mc-btn mc-play" id="mainPlayBtn">▶</button>
    <button class="mc-btn" id="nextBtn">⏭</button><button class="mc-btn" id="loopBtn">↺</button>
    <div class="vol-wrap"><span class="vol-icon">🔈</span><input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.01" value="0.8"/><span class="vol-icon">🔊</span></div>
  </div>
  <div class="player-section">
    <div class="player-header">
      <div class="player-title">🎧 Focus Playlist</div>
      <div style="display:flex;gap:12px"><button class="ctrl-btn" id="shuffleAllBtn">Shuffle All</button><button class="ctrl-btn" id="loopAllBtn">Loop</button></div>
    </div>
    <div class="track-list" id="trackList"></div>
  </div>
  <footer class="mw-footer"><span>© 2026 MoodWave</span><span>6 Moods · 180+ Tracks</span><a href="mood.html" style="color:rgba(255,255,255,.2);text-decoration:none">← Back to Moods</a></footer>
</div>
<audio id="audioEl"></audio>
<script>
const MOOD='Focus',ACCENT='#22d3ee';
let tracks=[],currentIdx=0,isPlaying=false,isLoop=false,isShuffle=false;
const audioEl=document.getElementById('audioEl'),trackList=document.getElementById('trackList'),mainPlayBtn=document.getElementById('mainPlayBtn'),heroPlayBtn=document.getElementById('heroPlayBtn'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),shuffleBtn=document.getElementById('shuffleBtn'),loopBtn=document.getElementById('loopBtn'),loopAllBtn=document.getElementById('loopAllBtn'),progressFill=document.getElementById('progressFill'),progressBg=document.getElementById('progressBg'),timeElapsed=document.getElementById('timeElapsed'),timeDuration=document.getElementById('timeDuration'),volSlider=document.getElementById('volSlider'),npTitle=document.getElementById('npTitle'),npArtist=document.getElementById('npArtist'),vizCanvas=document.getElementById('vizCanvas'),ctx2d=vizCanvas.getContext('2d');
let analyser,dataArr,audioCtx;
function toggleLoop(){isLoop=!isLoop;if(loopAllBtn)loopAllBtn.classList.toggle('active',isLoop);}
function initViz(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=128;dataArr=new Uint8Array(analyser.frequencyBinCount);const s=audioCtx.createMediaElementSource(audioEl);s.connect(analyser);analyser.connect(audioCtx.destination);}
function drawViz(){requestAnimationFrame(drawViz);if(!analyser){vizCanvas.width=vizCanvas.offsetWidth;vizCanvas.height=60;return}vizCanvas.width=vizCanvas.offsetWidth;vizCanvas.height=60;analyser.getByteFrequencyData(dataArr);ctx2d.clearRect(0,0,vizCanvas.width,60);const bw=vizCanvas.width/dataArr.length;for(let i=0;i<dataArr.length;i++){const h=(dataArr[i]/255)*55;ctx2d.fillStyle=ACCENT;ctx2d.globalAlpha=0.7;ctx2d.fillRect(i*bw,60-h,bw-1,h);}ctx2d.globalAlpha=1;}
drawViz();
function fmt(s){const m=Math.floor(s/60);return m+':'+(Math.floor(s%60)+'').padStart(2,'0')}
const syncDot=document.getElementById('syncDot');
async function loadTracks(isRefresh){try{const data=await fetch('/songs?mood='+MOOD+'&t='+Date.now()).then(r=>r.json());tracks=data.filter(s=>(s.mood||'').toLowerCase()===MOOD.toLowerCase());if(syncDot){syncDot.className='db-sync-dot';}}catch(e){if(!isRefresh)tracks=[];if(syncDot){syncDot.className='db-sync-dot error';}}renderList();if(!isRefresh&&tracks.length)loadTrack(0);}
function renderList(){trackList.innerHTML=tracks.map((t,i)=>`<div class="track-item${i===currentIdx?' active':''}" data-i="${i}"><div class="track-num">${String(i+1).padStart(2,'0')}</div><div class="track-info"><div class="track-name">${t.title}</div><div class="track-artist">${t.artist||''}</div></div><div class="track-mood-tag">${t.mood}</div><div class="track-dur" id="dur-${i}">—</div></div>`).join('');trackList.querySelectorAll('.track-item').forEach(el=>{el.addEventListener('click',()=>{loadTrack(+el.dataset.i);play();});});}
function loadTrack(i){currentIdx=i;const t=tracks[i];audioEl.src=t.audio_url;npTitle.textContent=t.title;npArtist.textContent=t.artist||'';document.title=`${t.title} — MoodWave`;progressFill.style.width='0%';timeElapsed.textContent='0:00';timeDuration.textContent='0:00';renderList();audioEl.load();audioEl.addEventListener('loadedmetadata',()=>{timeDuration.textContent=fmt(audioEl.duration);const el=document.getElementById('dur-'+i);if(el)el.textContent=fmt(audioEl.duration);},{once:true});}
function play(){initViz();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();audioEl.play();isPlaying=true;mainPlayBtn.textContent='⏸';heroPlayBtn.classList.add('playing');}
function pause(){audioEl.pause();isPlaying=false;mainPlayBtn.textContent='▶';heroPlayBtn.classList.remove('playing');}
mainPlayBtn.addEventListener('click',()=>{if(isPlaying)pause();else play();});
heroPlayBtn.addEventListener('click',()=>{if(tracks.length){if(isPlaying)pause();else play();}});
prevBtn.addEventListener('click',()=>{loadTrack((currentIdx-1+tracks.length)%tracks.length);play();});nextBtn.addEventListener('click',()=>{loadTrack((currentIdx+1)%tracks.length);play();});
audioEl.addEventListener('ended',()=>{if(isLoop){audioEl.currentTime=0;play();}else if(isShuffle){loadTrack(Math.floor(Math.random()*tracks.length));play();}else if(currentIdx<tracks.length-1){loadTrack(currentIdx+1);play();}else{isPlaying=false;mainPlayBtn.textContent='▶';heroPlayBtn.classList.remove('playing');}});
audioEl.addEventListener('timeupdate',()=>{if(!audioEl.duration)return;progressFill.style.width=(audioEl.currentTime/audioEl.duration*100)+'%';timeElapsed.textContent=fmt(audioEl.currentTime);});
progressBg.addEventListener('click',e=>{if(!audioEl.duration)return;const r=progressBg.getBoundingClientRect();audioEl.currentTime=((e.clientX-r.left)/r.width)*audioEl.duration;});
volSlider.addEventListener('input',()=>{audioEl.volume=volSlider.value;});
loopBtn.addEventListener('click',()=>{audioEl.currentTime=0;play();});
if(loopAllBtn)loopAllBtn.addEventListener('click',toggleLoop);
shuffleBtn.addEventListener('click',()=>{isShuffle=!isShuffle;shuffleBtn.style.color=isShuffle?ACCENT:'';});
document.getElementById('shuffleAllBtn').addEventListener('click',()=>{isShuffle=true;shuffleBtn.style.color=ACCENT;loadTrack(Math.floor(Math.random()*tracks.length));play();});
loadTracks();
setInterval(()=>loadTracks(true),3000);
</script>
<script src="mw-cursor.js"></script>
</body>
</html>
